name: Record history

on:
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency: history

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Record versions
        run: python3 scripts/history.py
      - name: Commit and request a Pages build
        run: |
          git add history.json releases.json
          if git diff --cached --quiet; then
            echo "No new versions"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record version history"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
      - name: Audit the data
        # Fails the run (so it shows up red) if the catalog or a mirror has a mistake worth fixing.
        run: python3 scripts/audit.py
