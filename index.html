<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibeclones</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#656d76; --line:#d8dee4; --accent:#0969da; --chip:#eef2f6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8d96a0; --line:#30363d; --accent:#4493f8; --chip:#21262d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  input { width:100%; padding:10px 12px; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  h2 { margin: 32px 0 2px; }
  h3 { margin: 16px 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .blurb { color: var(--muted); margin: 0; }
  .card { border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px; }
  .card h4 { margin:0; font-size:17px; }
  .card h4 a { color: var(--accent); text-decoration: none; }
  .chip { display:inline-block; background:var(--chip); border-radius:999px; padding:1px 10px; font-size:13px; margin:4px 4px 0 0; }
  .versions { font-size:14px; margin-top:6px; color:var(--muted); }
  .versions a { color: var(--accent); margin-right:8px; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Vibeclones</h1>
  <p class="sub">Vibecoded clones of well-known software. Pick the latest or an older version.</p>
  <input id="q" type="search" placeholder="Search apps or what they clone…" aria-label="Search">
  <div id="out"></div>
</main>
<script>
const out = document.getElementById('out');
const q = document.getElementById('q');
let data = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function card(app) {
  const base = `/${encodeURIComponent(app.slug)}/`;
  const multi = app.clones.length > 1;
  const chips = app.clones.map(c => `<span class="chip">${esc(c)}</span>`).join('');
  const kind = `<span class="chip">${multi ? 'Multi-app clone' : 'Single-app clone'}</span>`;
  const vers = app.versions.length
    ? `<div class="versions">Versions: ${app.versions.map(v => `<a href="${base}v${encodeURIComponent(v)}/">${esc(v)}</a>`).join('')}</div>`
    : `<div class="versions">No releases yet</div>`;
  const title = app.versions.length ? `<a href="${base}latest/">${esc(app.name)}</a>` : esc(app.name);
  return `<div class="card"><h4>${title}${app.latest ? ` <span class="chip">latest ${esc(app.latest)}</span>` : ''}</h4>
    <div>${kind}${chips}</div><p class="blurb">${esc(app.description)}</p>${vers}</div>`;
}

function render() {
  const term = q.value.trim().toLowerCase();
  const match = a => !term || [a.name, a.type, a.description, ...a.clones].join(' ').toLowerCase().includes(term);
  let html = '';
  for (const cat of data.categories) {
    const apps = data.apps.filter(a => a.category === cat.id && match(a));
    if (!apps.length) continue;
    html += `<h2>${esc(cat.name)}</h2><p class="blurb">${esc(cat.blurb)}</p>`;
    const types = [...new Set(apps.map(a => a.type))].sort();
    for (const t of types) {
      html += `<h3>${esc(t)}</h3>` + apps.filter(a => a.type === t).map(card).join('');
    }
  }
  out.innerHTML = html || '<p class="empty">Nothing matches.</p>';
}

fetch('catalog.json').then(r => r.json()).then(d => { data = d; render(); })
  .catch(() => { out.innerHTML = '<p class="empty">Could not load catalog.json.</p>'; });
q.addEventListener('input', () => data && render());
</script>
</body>
</html>
